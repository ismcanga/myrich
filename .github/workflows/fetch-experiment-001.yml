name: Fetch Experiment 001

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install inspection dependency
        run: python -m pip install netCDF4 numpy

      - name: Create artifact directory
        run: mkdir -p artifacts/experiment-001

      - name: Fetch NOAA North Pacific west
        run: |
          curl --fail --location --retry 3 --globoff \
            --output artifacts/experiment-001/noaa_np_west_2025-01.nc \
            'https://coastwatch.pfeg.noaa.gov/erddap/griddap/nesdisSSH1day.nc?ugos[(2025-01-01T00:00:00Z):1:(2025-01-31T00:00:00Z)][(20):1:(50)][(140):1:(179.875)],vgos[(2025-01-01T00:00:00Z):1:(2025-01-31T00:00:00Z)][(20):1:(50)][(140):1:(179.875)]'

      - name: Fetch NOAA North Pacific east
        run: |
          curl --fail --location --retry 3 --globoff \
            --output artifacts/experiment-001/noaa_np_east_2025-01.nc \
            'https://coastwatch.pfeg.noaa.gov/erddap/griddap/nesdisSSH1day.nc?ugos[(2025-01-01T00:00:00Z):1:(2025-01-31T00:00:00Z)][(20):1:(50)][(-179.875):1:(-130)],vgos[(2025-01-01T00:00:00Z):1:(2025-01-31T00:00:00Z)][(20):1:(50)][(-179.875):1:(-130)]'

      - name: Record checksums
        run: |
          cd artifacts/experiment-001
          sha256sum noaa_np_west_2025-01.nc noaa_np_east_2025-01.nc > SHA256SUMS.txt

      - name: Record provenance
        run: |
          cat > artifacts/experiment-001/provenance.json <<'EOF'
          {
            "experiment": "001",
            "source": "NOAA CoastWatch ERDDAP",
            "dataset_id": "nesdisSSH1day",
            "dataset_status": "experimental",
            "variables": ["ugos", "vgos"],
            "latitude_min": 20.0,
            "latitude_max": 50.0,
            "longitude_ranges": [
              [140.0, 179.875],
              [-179.875, -130.0]
            ],
            "time_start": "2025-01-01T00:00:00Z",
            "time_end": "2025-01-31T00:00:00Z",
            "nominal_grid_degrees": 0.25,
            "nominal_cadence": "daily",
            "transformations": [],
            "native_coordinate_system_preserved": true
          }
          EOF

      - name: Inspect raw acquisition
        run: python scripts/inspect_experiment_001.py

      - name: Build Experiment 001 pair population
        run: python scripts/build_experiment_001_pairs.py

      - name: Validate pair summary
        run: python -m json.tool artifacts/experiment-001/pairs_summary.json

      - name: Run Experiment 001 persistence baseline
        run: python scripts/baseline_experiment_001.py

      - name: Validate baseline summary
        run: python -m json.tool artifacts/experiment-001/baseline_summary.json

      - name: Localize Experiment 001 failures
        run: python scripts/localize_failures_experiment_001.py

      - name: Validate failure localization
        run: python -m json.tool artifacts/experiment-001/failure_localization.json

      - name: Verify failure localization against source
        run: python scripts/verify_failure_localization_experiment_001.py

      - name: Describe localized failure fields
        run: python scripts/describe_failure_fields_experiment_001.py

      - name: Validate failure field descriptions v2
        run: python -m json.tool artifacts/experiment-001/failure_field_descriptions_v2.json > /dev/null

      - name: Validate inspection JSON
        run: python -m json.tool artifacts/experiment-001/inspection.json

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-001-noaa-2025-01
          path: artifacts/experiment-001/
          retention-days: 30
